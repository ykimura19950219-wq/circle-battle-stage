document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

shadow-md:0 8px 24px rgba(12,37,64,0.12);\n--shadow-lg:0 16px 40px rgba(12,37,64,0.16);\n--ease-out:cubic-bezier(.16,1,.3,1);/* @kind other */--ease-standard:cubic-bezier(.4,0,.2,1);/* @kind other */\n--dur-fast:120ms;/* @kind other */--dur-normal:220ms;/* @kind other */\n}\n<\u002Fstyle>\n  <script src=\"3b042ea8-0e35-4307-a140-1683d73b6367\"><\u002Fscript>\n  <script src=\"b69085ad-515b-4fd1-9ead-120766c3246b\"><\u002Fscript>\n  \n  <style>\n    body{margin:0;background:var(--color-bg);font-family:var(--font-body);}\n    a{color:var(--color-accent-strong);text-decoration:none;}\n    a:hover{color:var(--color-accent);text-decoration:underline;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:100%;overflow-x:hidden;background:var(--color-bg);\">\n\n  <!-- NAV -->\n  <nav style=\"position:sticky;top:0;z-index:20;background:var(--navy-900);padding:var(--space-3) var(--space-5);display:flex;align-items:center;justify-content:center;gap:var(--space-6);border-bottom:1px solid rgba(255,255,255,0.12);\">\n    <a href=\"#top\" style=\"color:#fff;font-weight:700;font-size:var(--text-xs);text-decoration:none;\">TOP<\u002Fa>\n    <a href=\"#teams\" style=\"color:#fff;font-weight:700;font-size:var(--text-xs);text-decoration:none;\">対戦団体<\u002Fa>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <section id=\"top\" style=\"position:relative;overflow:hidden;background:linear-gradient(180deg, var(--navy-900), var(--navy-800));padding:var(--space-9) var(--space-5) var(--space-7);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-5);\">\n    <div style=\"position:absolute;inset:0;z-index:0;opacity:0.45;\">\n      <image-slot id=\"hero-bg-photo\" shape=\"rect\" placeholder=\"甲子園の写真（うっすら背景に）\" style=\"width:100%;height:100%;\" src=\"aaf73ff8-745e-47c7-b7ac-6ede2d663b44\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(60,160,190,0.35), transparent 60%), linear-gradient(180deg, rgba(12,37,64,0.7), rgba(20,60,100,0.8));\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;background:#fff;border-radius:16px;padding:8px 16px;box-shadow:var(--shadow-md);\"><img src=\"23c2e59f-aa9d-4b9c-8f47-6c145115586c\" alt=\"Local STAGE Project\" style=\"height:64px;display:block;\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;\"><x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Badge\" hint-size=\"auto,32px\">限定案内<\u002Fx-import><\u002Fdiv>\n    <h1 style=\"position:relative;z-index:2;margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(40px,7vw,var(--text-5xl));color:#fff;line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);\">CIRCLE BATTLE<br>STAGE<\u002Fh1>\n    <p style=\"position:relative;z-index:2;margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-md);color:var(--teal-200);\">― 団体の誇りを懸けた、真剣勝負のハッカソン ―<\u002Fp>\n    <p style=\"position:relative;z-index:2;margin:0;font-size:var(--text-sm);color:var(--navy-100);font-weight:500;\">学生団体対抗ハッカソン 開催のご案内<\u002Fp>\n    <div style=\"position:relative;z-index:2;display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center;margin-top:var(--space-2);\">\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Tag\" hint-size=\"auto,28px\">2026年12月開催<\u002Fx-import>\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Tag\" hint-size=\"auto,28px\">ハイブリッド開催<\u002Fx-import>\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Tag\" hint-size=\"auto,28px\">全9日間<\u002Fx-import>\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Tag\" hint-size=\"auto,28px\">全国15団体・70名規模<\u002Fx-import>\n    <\u002Fdiv>\n    <p style=\"position:relative;z-index:2;margin:var(--space-3) 0 0;font-family:var(--font-display);font-weight:900;font-size:var(--text-lg);color:var(--teal-400);letter-spacing:var(--tracking-tight);\">エンジニア版・甲子園、開幕。<\u002Fp>\n  <\u002Fsection>\n\n  <!-- INTRO -->\n  <section style=\"max-width:720px;margin:0 auto;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;gap:var(--space-5);\">\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n      日頃より学生エンジニアコミュニティの活動にご尽力いただき、誠にありがとうございます。\n    <\u002Fp>\n    <p style=\"margin:0;font-size:var(--text-md);line-height:var(--leading-normal);color:var(--color-text);font-weight:500;\">\n      ついに、あの構図がやってきます。個人の力ではなく、<span style=\"color:var(--color-accent-strong);font-weight:700;\">「団体の看板」を背負って挑む<\u002Fspan>、かつてないハッカソン――「CIRCLE BATTLE STAGE」。\n    <\u002Fp>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n      これは、ただのハッカソンではありません。あなたの団体が積み上げてきた技術力・チームワーク・熱量そのものが試される、<span style=\"color:var(--color-accent-strong);font-weight:700;\">団体対抗の真剣勝負<\u002Fspan>です。仲間と肩を並べ、他コミュニティと本気でぶつかり合う――そんな舞台を、Local STAGE Projectがご用意します。\n    <\u002Fp>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text-muted);\">\n      この案内は、企画に強くご関心をお寄せいただけると見込んでいる団体の皆さまへ、限定でお送りしております。ぜひ、この熱狂の輪の中に加わってください。\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- 甲子園フック -->\n  <section style=\"max-width:720px;margin:0 auto;padding:var(--space-7) var(--space-5) var(--space-8);display:flex;flex-direction:column;gap:var(--space-4);\">\n    <p style=\"margin:0;font-family:var(--font-display);font-weight:900;font-size:var(--text-xl);color:var(--color-primary-strong);line-height:var(--leading-snug);\">\n      毎年、団体の代表がこのステージに立つ。<br>そんな大会に、なっていく。\n    <\u002Fp>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n      甲子園がそうであるように、大会は毎年積み重なるほど熱くなる。「あの年の優勝団体」「あの伝説の一戦」――そういう歴史は、誰かが最初に立たなければ生まれません。<span style=\"color:var(--color-accent-strong);font-weight:700;\">CIRCLE BATTLE STAGEの記念すべき初回に、あなたの団体の名前を刻みませんか。<\u002Fspan>\n    <\u002Fp>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text-muted);\">\n      個人の実力だけでは終わらない。仲間と積み上げてきたもの全部を懸けて、他の団体とぶつかり合う。勝っても負けても、この舞台に立った経験は一生の話のタネになります。\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- CONCEPT -->\n  <section style=\"background:var(--color-surface-alt);padding:var(--space-8) var(--space-5);\">\n    <div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);align-items:center;\">\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"CONCEPT\" title=\"Local STAGE Projectとは\" align=\"center\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Tagline\" hint-size=\"auto,100px\" align=\"center\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 開催概要 -->\n  <section style=\"max-width:720px;margin:0 auto;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;gap:var(--space-6);\">\n    <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"OUTLINE\" title=\"開催概要\"><\u002Fx-import>\n    <div style=\"display:flex;flex-direction:column;\">\n      <sc-for list=\"{{ outlineRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid;grid-template-columns:140px 1fr;gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-border);\">\n          <span style=\"font-size:var(--text-xs);font-weight:700;color:var(--color-text-muted);\">{{ row.label }}<\u002Fspan>\n          <span style=\"font-size:var(--text-sm);color:var(--color-text);line-height:var(--leading-normal);white-space:pre-line;\">{{ row.value }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 参加対象・規模 -->\n  <section style=\"background:var(--color-surface-alt);padding:var(--space-8) var(--space-5);\">\n    <div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);\">\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"ENTRY\" title=\"参加対象・規模\"><\u002Fx-import>\n      <div style=\"display:flex;gap:var(--space-7);flex-wrap:wrap;\">\n        <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.StatBlock\" hint-size=\"100px,90px\" value=\"15団体\" label=\"参加団体数（目標）\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.StatBlock\" hint-size=\"100px,90px\" value=\"70名\" label=\"参加者数（目標）\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.StatBlock\" hint-size=\"100px,90px\" value=\"全国\" label=\"地域を問わず募集\"><\u002Fx-import>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--space-3);\">\n        <li style=\"font-size:var(--text-sm);color:var(--color-text);line-height:var(--leading-normal);\">参加単位：既存の学生エンジニアコミュニティ（団体単位でのエントリー）<\u002Fli>\n        <li style=\"font-size:var(--text-sm);color:var(--color-text);line-height:var(--leading-normal);\">首都圏に限らず、全国の地方コミュニティも積極的に募集<\u002Fli>\n        <li style=\"font-size:var(--text-sm);color:var(--color-text);line-height:var(--leading-normal);\">各団体からの参加人数・チーム編成ルールは今後決定し、改めてご案内します<\u002Fli>\n      <\u002Ful>\n      <p style=\"margin:0;font-size:var(--text-2xs);color:var(--color-text-muted);\">※上記は現時点の募集目標値です。実際の団体数・人数は今後の募集状況により変動します<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 優勝の様子 -->\n  <section style=\"max-width:720px;margin:0 auto;padding:0 var(--space-5) var(--space-8);display:flex;justify-content:center;\">\n    <image-slot id=\"celebration-photo\" shape=\"rounded\" radius=\"20\" placeholder=\"優勝チームが会場でPC・トロフィー・スマホを片手に喜び合う写真\" style=\"width:100%;max-width:600px;aspect-ratio:4/3;\" src=\"9ee643a2-0f89-4138-939a-ef098e4043c6\"><\u002Fimage-slot>\n  <\u002Fsection>\n\n  <!-- 対戦団体 -->\n  <section id=\"teams\" style=\"max-width:720px;margin:0 auto;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;gap:var(--space-5);align-items:center;text-align:center;\">\n    <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"TEAMS\" title=\"対戦団体\" align=\"center\"><\u002Fx-import>\n    <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Badge\" hint-size=\"auto,32px\">Coming Soon<\u002Fx-import>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text-muted);max-width:480px;\">参戦団体は決定次第、こちらで順次公開予定です。<\u002Fp>\n  <\u002Fsection>\n\n  <!-- GALLERY -->\n  <section style=\"max-width:720px;margin:0 auto;padding:0 var(--space-5) var(--space-8);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);\">\n    <image-slot id=\"gallery-1\" shape=\"rounded\" radius=\"20\" placeholder=\"団体開発・ハッカソンの様子\" style=\"width:100%;height:220px;\" src=\"2baa4584-e93e-4b27-8b6f-2f0ea915c728\"><\u002Fimage-slot>\n    <image-slot id=\"gallery-2\" shape=\"rounded\" radius=\"20\" placeholder=\"表彰・交流の様子\" style=\"width:100%;height:220px;\" src=\"4c5cc5ed-78a0-4879-b361-a20fa5159b22\"><\u002Fimage-slot>\n  <\u002Fsection>\n\n  <!-- 対戦形式 -->\n  <section style=\"max-width:720px;margin:0 auto;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;gap:var(--space-5);\">\n    <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"FORMAT\" title=\"対戦形式\"><\u002Fx-import>\n    <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n      参加団体は同一期間・同一条件で並行して開発に挑み、審査員が全団体を横並びで評価する<span style=\"color:var(--color-accent-strong);font-weight:700;\">総当たり形式<\u002Fspan>。逃げ場のない、全団体同じ土俵での真っ向勝負です。1対1の勝ち上がりトーナメントではなく、全員が同時にステージへ上がります。\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- 賞・表彰 -->\n  <section style=\"background:var(--color-surface-alt);padding:var(--space-8) var(--space-5);\">\n    <div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-5);\">\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"AWARD\" title=\"賞・表彰\"><\u002Fx-import>\n      <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n        見事勝ち抜いた優勝団体には、団体の誇りとともに栄冠を。詳細（副賞内容等）は決定次第ご案内します。\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- スケジュール -->\n  <section style=\"max-width:720px;margin:0 auto;padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;gap:var(--space-6);\">\n    <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"SCHEDULE\" title=\"スケジュール（予定）\"><\u002Fx-import>\n    <div style=\"display:flex;flex-direction:column;gap:0;\">\n      <sc-for list=\"{{ scheduleSteps }}\" as=\"step\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:var(--space-5);\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;\">\n            <span style=\"width:32px;height:32px;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-on-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:var(--text-xs);flex-shrink:0;\">{{ step.n }}<\u002Fspan>\n            <sc-if value=\"{{ step.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"width:2px;flex:1;background:var(--color-border);margin:4px 0;\"><\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"padding-bottom:var(--space-6);\">\n            <p style=\"margin:0;font-size:var(--text-sm);font-weight:700;color:var(--color-text);line-height:var(--leading-snug);\">{{ step.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:var(--text-2xs);color:var(--color-text-muted);\">※詳細なタイムテーブルは決定次第、改めてご案内します<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 今後の流れ -->\n  <section style=\"background:var(--color-surface-alt);padding:var(--space-8) var(--space-5);\">\n    <div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-5);\">\n      <x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.SectionHeader\" hint-size=\"auto,80px\" kicker=\"NEXT\" title=\"今後の流れ\"><\u002Fx-import>\n      <p style=\"margin:0;font-size:var(--text-sm);line-height:var(--leading-normal);color:var(--color-text);\">\n        本案内は先行案内であり、正式な参加募集ではありません。テーマ・会場・具体的な日程が確定し次第、参加方法とあわせて改めてご案内いたします。\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 呼びかけ CALLOUT -->\n  <section style=\"background:linear-gradient(180deg, var(--navy-800), var(--navy-900));padding:var(--space-9) var(--space-5);text-align:center;\">\n    <div style=\"max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-5);align-items:center;\">\n      <p style=\"margin:0;font-family:var(--font-display);font-weight:900;font-size:var(--text-xl);color:#fff;line-height:var(--leading-snug);\">\n        次の一手を決めるのは、あなたの団体です。\n      <\u002Fp>\n      <p style=\"margin:0;font-size:var(--text-sm);color:var(--navy-100);line-height:var(--leading-normal);\">\n        ぜひこの熱量を仲間にも共有していただき、参加をご検討ください。ご関心をお持ちいただける場合は、お気軽にご連絡ください。\n      <\u002Fp>\n      <p style=\"margin:0;font-size:var(--text-sm);color:var(--teal-200);line-height:var(--leading-normal);font-weight:700;\">\n        エンジニア版・甲子園の初代王者は、まだ誰でもありません。\n      <\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-display);font-weight:900;font-size:var(--text-lg);color:var(--teal-400);\">\n        その団体の本気、見せてください。\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section style=\"padding:var(--space-8) var(--space-5);display:flex;flex-direction:column;align-items:center;gap:var(--space-4);text-align:center;\">\n    <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf1ycbI_6PI6uwRRtieAA1FPC7iTgP4CsDDMPbJ1RCDqGTT8A/viewform?usp=dialog\" target=\"_blank\" style=\"text-decoration:none;\"><x-import component-from-global-scope=\"LOCALSTAGEDesignSystem_f57089.Button\" hint-size=\"auto,56px\" variant=\"accent\" size=\"lg\">参加エントリーはこちら<\u002Fx-import><\u002Fa>\n    <p style=\"margin:0;font-size:var(--text-2xs);color:var(--color-text-muted);\">Googleフォームからご登録いただけます。<\u002Fp>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid var(--color-border);padding:var(--space-7) var(--space-5);display:flex;flex-direction:column;align-items:center;gap:var(--space-3);\">\n    <img src=\"23c2e59f-aa9d-4b9c-8f47-6c145115586c\" alt=\"Local STAGE Project\" style=\"height:48px;object-fit:contain;\">\n    <p style=\"margin:0;font-size:var(--text-xs);font-weight:700;color:var(--color-text);\">Local STAGE Project 事務局<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      outlineRows: [\n        { label: 'イベント名', value: 'CIRCLE BATTLE STAGE' },\n        { label: '主催', value: '株式会社ローカルイノベーション（Local STAGE Project）' },\n        { label: '開催時期', value: '2026年12月（詳細日程は決定次第、改めてご案内します）' },\n        { label: '開催形式', value: 'ハイブリッド（オンライン＋オフライン）' },\n        { label: '開催ボリューム', value: '全9日間（事前オンライン開発期間＋最終2日間はオフライン会場での成果発表・表彰）' },\n        { label: '想定規模', value: '全国15団体・参加者計70名程度を想定（募集目標値。実際の団体数・人数は今後の募集状況により変動）' },\n        { label: '会場', value: '検討中（全国から集まる前提のため、主要駅・空港からのアクセスを重視して選定）' },\n        { label: 'テーマ', value: '検討中（決定次第ご案内します）' },\n      ],\n      scheduleSteps: [\n        { n: 1, text: 'Day1｜エントリー締切・キックオフ（オンライン）', notLast: true },\n        { n: 2, text: 'Day2〜7｜開発期間（各団体でオンライン開発を進行）', notLast: true },\n
